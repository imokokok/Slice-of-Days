name: 100 restaurant checks

on:
  pull_request:
    paths:
      - "prototypes/100-restaurant/**"
      - ".github/workflows/100-restaurant-checks.yml"
  push:
    branches: [main]
    paths:
      - "prototypes/100-restaurant/**"
      - ".github/workflows/100-restaurant-checks.yml"

permissions:
  contents: read

jobs:
  gameplay-storage-and-assets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/100-restaurant
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot 4.7.2
        run: |
          curl -L --fail -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import clean project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit-after 120
      - name: Run complete regression suite
        shell: pwsh
        run: ./tools/test.ps1 -GodotPath /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
